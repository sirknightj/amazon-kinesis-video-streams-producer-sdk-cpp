name: Producer CPP JNI Builds

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  mac-os:
    strategy:
      matrix:
        mac:
          - name: Intel x86_64
            runner: macos-13
          - name: Apple Silicon
            runner: macos-15

      fail-fast: false

    name: JNI ${{ matrix.mac.name }}

    runs-on: ${{ matrix.mac.runner }}
    steps:
      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build JNI (CMake)
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_JNI=ON -DBUILD_JNI_ONLY=ON
          
          # Note: Dependencies on/off shouldn't make any difference since
          # the only dependency for the JNI is PIC

      - name: Build JNI (make)
        working-directory: ./build
        run: |
          make -j$(sysctl -n hw.cpu)