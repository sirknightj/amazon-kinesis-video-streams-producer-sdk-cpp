name: Producer CPP JNI Builds

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  mac-os:
    strategy:
      matrix:
        dependencies:
          - ON
          - OFF
        mac:
          - name: Intel x86_64
            runner: macos-13
          - name: Apple Silicon
            runner: macos-15

      fail-fast: false

    name: JNI ${{ matrix.mac.name }} deps=${{ matrix.dependencies }}

    runs-on: ${{ matrix.mac.runner }}
    steps:
      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        if: ${{ matrix.dependencies == 'OFF' }}
        run: |
          brew install log4cplus

      - name: Install dependencies
        if: ${{ matrix.dependencies == 'ON' }}
        run: |
          brew install autoconf automake CMake m4

      - name: Build JNI
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_JNI=ON -DBUILD_DEPENDENCIES=${{ matrix.dependencies }}

          make -j$(sysctl -n hw.cpu)